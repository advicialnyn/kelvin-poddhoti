<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kelvin's Method Galvanometer Simulator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .card { background: white; max-width: 600px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-top: 0; color: #333; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    input { width: 90%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .controls { text-align: center; margin-bottom: 20px; }
    button { padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin: 5px; }
    .btn-main { background: #007bff; color: white; }
    .btn-tap { background: #e0a800; color: white; }
    .dial-box { text-align: center; background: #1e1e1e; padding: 20px; border-radius: 8px; color: white; }
    svg { width: 250px; height: 130px; }
    .readout { font-size: 16px; margin-top: 10px; font-weight: bold; color: #4db8ff; }
  </style>
</head>
<body>

<div class="card">
  <h2>Kelvin's Method Simulator</h2>
  
  <div class="grid">
    <div>
      <label>Ratio Arm P (Ω):</label>
      <input type="number" id="valP" value="100" oninput="calculate()">
    </div>
    <div>
      <label>Ratio Arm Q (Ω):</label>
      <input type="number" id="valQ" value="10" oninput="calculate()">
    </div>
    <div>
      <label>Variable Resistor R (Ω):</label>
      <input type="number" id="valR" value="500" oninput="calculate()">
    </div>
    <div>
      <label>Test Galvanometer G (Ω):</label>
      <input type="number" id="valG" value="50" oninput="calculate()">
    </div>
  </div>

  <div class="controls">
    <button class="btn-main" onclick="toggleK1()" id="btnK1">Turn Circuit ON (K₁)</button>
    <button class="btn-tap" onmousedown="pressK2()" onmouseup="releaseK2()" onmouseleave="releaseK2()">Press & Hold K₂</button>
  </div>

  <div class="dial-box">
    <svg viewBox="0 0 200 110">
      <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#fff" stroke-width="3"/>
      <!-- Scale ticks -->
      <line x1="20" y1="100" x2="30" y2="95" stroke="#fff" />
      <line x1="100" y1="20" x2="100" y2="30" stroke="#ff4d4d" stroke-width="2"/>
      <line x1="180" y1="100" x2="170" y2="95" stroke="#fff" />
      <!-- Needle -->
      <line id="needle" x1="100" y1="100" x2="100" y2="25" stroke="#ff4d4d" stroke-width="3" style="transition: transform 0.2s ease-out; transform-origin: 100px 100px; transform: rotate(-60deg);"/>
      <circle cx="100" cy="100" r="6" fill="#fff"/>
    </svg>
    <div class="readout" id="statusText">Circuit OFF</div>
  </div>
</div>

<script>
  let k1Closed = false;
  let k2Pressed = false;

  function toggleK1() {
    k1Closed = !k1Closed;
    document.getElementById('btnK1').innerText = k1Closed ? "Turn Circuit OFF (K₁)" : "Turn Circuit ON (K₁)";
    calculate();
  }

  function pressK2() {
    if (!k1Closed) return;
    k2Pressed = true;
    calculate();
  }

  function releaseK2() {
    k2Pressed = false;
    calculate();
  }

  function calculate() {
    const P = parseFloat(document.getElementById('valP').value) || 1;
    const Q = parseFloat(document.getElementById('valQ').value) || 1;
    const R = parseFloat(document.getElementById('valR').value) || 0;
    const G = parseFloat(document.getElementById('valG').value) || 1;
    const needle = document.getElementById('needle');
    const status = document.getElementById('statusText');

    if (!k1Closed) {
      needle.style.transform = `rotate(-60deg)`;
      status.innerText = "Circuit OFF (Key K₁ Open)";
      return;
    }

    const V_total = 10; 
    let Ig = 0;

    if (!k2Pressed) {
      // K2 Open: Current through arm CD (R + G branch)
      Ig = V_total / (R + G);
      status.innerText = `K₁ ON | Baseline Deflection (K₂ Open)`;
    } else {
      // K2 Closed: Nodes B and D connected
      const R_ABD = (P * R) / (P + R);
      const R_BDC = (Q * G) / (Q + G);
      const V_BD = V_total * (R_BDC / (R_ABD + R_BDC));
      Ig = V_BD / G;

      const balancedR = (P / Q) * G;
      if (Math.abs(R - balancedR) < 0.1) {
        status.innerText = `BALANCED! No deflection shift on tapping K₂`;
      } else if (R > balancedR) {
        status.innerText = `K₂ Tapped: Deflection SHIFTED UPWARDS (+)`;
      } else {
        status.innerText = `K₂ Tapped: Deflection SHIFTED DOWNWARDS (-)`;
      }
    }

    // Map current to needle angle (-50deg to +50deg)
    let angle = -60 + Math.min(Math.max(Ig * 5000, 10), 110);
    needle.style.transform = `rotate(${angle}deg)`;
  }
</script>

</body>
</html>
